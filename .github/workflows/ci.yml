name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly build at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x86_64-linux
          - os: macos-latest
            triplet: aarch64-darwin

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: build
        run: |
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: test
        run: |
          make check

      - name: test windows build (wine)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v wine >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends wine64 wine
          fi
          make test-wine

      - name: test darwin mach-o build
        if: matrix.os == 'ubuntu-latest'
        run: |
          make test-darwin

      - name: package nightly artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          STAGE="pith-${{ matrix.triplet }}-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 vendor/tcc/libtcc1.a "$STAGE/libtcc1.a" 2>/dev/null || true
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h \
                    include/compiler.h include/pith_embed.h \
                    "$STAGE/include/"
          tar -czf "pith-${{ matrix.triplet }}-nightly.tar.gz" -C "$STAGE" .

      - name: upload nightly artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pith-${{ matrix.triplet }}-nightly
          path: pith-${{ matrix.triplet }}-nightly.tar.gz

  release:
    name: publish nightly release
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: nightly
          name: "Pith Nightly Build"
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Automated rolling nightly build for Pith.

            Updated automatically from the `main` branch.

            ### Verification
            Verify downloaded archive integrity using the included `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            release-assets/*
