name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Nightly build at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: build
        run: |
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: test
        run: |
          make check

      - name: test windows build (wine)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v wine >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends wine64 wine
          fi
          make test-wine

      - name: test darwin mach-o build
        if: matrix.os == 'ubuntu-latest'
        run: |
          make test-darwin

      - name: package linux and windows nightly artifacts
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist

          # 1. x86_64-linux (already built)
          STAGE="pith-x86_64-linux-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 vendor/tcc/libtcc1.a "$STAGE/libtcc1.a" 2>/dev/null || true
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-x86_64-linux-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-x86_64-linux-nightly.tar.gz" "dist/pith-x86_64-linux.tar.gz"
          rm -rf "$STAGE"

          # 2. aarch64-linux cross-compilation
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          make clean
          make -j"$(nproc)" CC="aarch64-linux-gnu-gcc" AR="aarch64-linux-gnu-ar" PITH=pith LIBTCC="" TCC_LINK="" TCC_CFLAGS="-DPITH_HAVE_LIBTCC=0"
          STAGE="pith-aarch64-linux-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-aarch64-linux-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-aarch64-linux-nightly.tar.gz" "dist/pith-aarch64-linux.tar.gz"
          rm -rf "$STAGE"

          # 3. Windows cross-compilation via llvm-mingw (x86_64 and aarch64)
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL "$LLVM_MINGW_URL" -o /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          export PATH="/opt/llvm-mingw/bin:$PATH"

          # 3a. x86_64-windows
          make clean
          make -j"$(nproc)" CC="x86_64-w64-mingw32-clang" AR="x86_64-w64-mingw32-ar" PITH=pith.exe LIBTCC="" TCC_LINK="" TCC_CFLAGS="-DPITH_HAVE_LIBTCC=0 -D_WIN32" LDFLAGS="-lkernel32 -ladvapi32"
          STAGE="pith-x86_64-windows-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith.exe "$STAGE/pith.exe"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-x86_64-windows-nt-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-x86_64-windows-nt-nightly.tar.gz" "dist/pith-x86_64-windows-nightly.tar.gz"
          cp "dist/pith-x86_64-windows-nt-nightly.tar.gz" "dist/pith-x86_64-windows-nt.tar.gz"
          cp "dist/pith-x86_64-windows-nt-nightly.tar.gz" "dist/pith-x86_64-windows.tar.gz"
          rm -rf "$STAGE"

          # 3b. aarch64-windows
          make clean
          make -j"$(nproc)" CC="aarch64-w64-mingw32-clang" AR="aarch64-w64-mingw32-ar" PITH=pith.exe LIBTCC="" TCC_LINK="" TCC_CFLAGS="-DPITH_HAVE_LIBTCC=0 -D_WIN32" LDFLAGS="-lkernel32 -ladvapi32"
          STAGE="pith-aarch64-windows-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith.exe "$STAGE/pith.exe"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-aarch64-windows-nt-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-aarch64-windows-nt-nightly.tar.gz" "dist/pith-aarch64-windows-nightly.tar.gz"
          cp "dist/pith-aarch64-windows-nt-nightly.tar.gz" "dist/pith-aarch64-windows-nt.tar.gz"
          cp "dist/pith-aarch64-windows-nt-nightly.tar.gz" "dist/pith-aarch64-windows.tar.gz"
          rm -rf "$STAGE"

      - name: package macos and darwin nightly artifacts
        if: (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.os == 'macos-latest'
        run: |
          mkdir -p dist

          # 1. aarch64-macos (already built natively)
          codesign -s - pith 2>/dev/null || true
          STAGE="pith-aarch64-macos-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-aarch64-macos-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-aarch64-macos-nightly.tar.gz" "dist/pith-aarch64-macos.tar.gz"
          rm -rf "$STAGE"

          # 2. x86_64-macos
          make clean
          make -j"$(sysctl -n hw.ncpu)" CC="clang -arch x86_64" AR="ar" PITH=pith LIBTCC="" TCC_LINK="" TCC_CFLAGS="-DPITH_HAVE_LIBTCC=0"
          codesign -s - pith 2>/dev/null || true
          STAGE="pith-x86_64-macos-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-x86_64-macos-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-x86_64-macos-nightly.tar.gz" "dist/pith-x86_64-macos.tar.gz"
          rm -rf "$STAGE"

          # 3. x86_64-darwin (pure Darwin without codesigning or macOS specifics)
          codesign --remove-signature pith 2>/dev/null || true
          STAGE="pith-x86_64-darwin-nightly"
          mkdir -p "$STAGE/include"
          install -m 0755 pith "$STAGE/pith"
          install -m 0644 runtime/libruntime.a "$STAGE/libruntime.a"
          install -m 0644 include/pith.h include/api.h include/compiler.h include/pith_embed.h "$STAGE/include/"
          tar -czf "dist/pith-x86_64-darwin-nightly.tar.gz" -C "$STAGE" .
          cp "dist/pith-x86_64-darwin-nightly.tar.gz" "dist/pith-x86_64-darwin.tar.gz"
          rm -rf "$STAGE"

      - name: upload nightly artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/*.tar.gz

  release:
    name: publish nightly release
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: publish to github release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: nightly
          name: "Pith Nightly Build"
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Automated rolling nightly build for Pith.

            Updated automatically from the `main` branch.

            ### Verification
            Verify downloaded archive integrity using the included `SHA256SUMS.txt`:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            release-assets/*
